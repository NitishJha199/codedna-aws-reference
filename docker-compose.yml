services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: referenceapp
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - reference_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d referenceapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-service:
    build:
      context: ./src/inventory-service
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/referenceapp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18002:8001"

  order-api:
    build:
      context: ./src/order-api
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/referenceapp
      INVENTORY_SERVICE_URL: http://inventory-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
    ports:
      - "18001:8000"

volumes:
  reference_postgres_data:
